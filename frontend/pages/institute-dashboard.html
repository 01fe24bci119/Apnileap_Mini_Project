<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Institute Dashboard | ApniLeap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/styles.css" rel="stylesheet">
</head>
<body>

<nav class="al-navbar navbar navbar-expand-xl">
  <a class="al-brand" href="dashboard.html">APNI<span>LEAP</span></a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" aria-controls="navMain" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navMain">
    <div class="d-flex flex-column flex-xl-row">
      <a class="nav-link active" href="dashboard.html">Dashboard</a>
      <a class="nav-link" href="reports.html">Reports</a>
      <a class="nav-link d-none" id="navAdmin" href="administration.html">Administration</a>
    </div>
    <div class="d-flex align-items-center gap-2 ms-xl-auto mt-2 mt-xl-0">
      <span class="al-user-chip" id="userChip">&nbsp;</span>
      <button class="btn btn-sm btn-outline-light" id="logoutBtn">Logout</button>
    </div>
  </div>
</nav>

<div class="al-page">
  <div class="al-page-header">
    <div>
      <p class="al-page-subtitle mb-0"><a href="dashboard.html">Dashboard</a> / <span id="instituteName">…</span></p>
      <h1 class="al-page-title" id="instituteTitle">Institute Dashboard</h1>
    </div>
  </div>



  <div class="al-card">
    <h2>Departments</h2>
    <div class="table-responsive">
      <table class="table al-table">
        <thead>
          <tr>
            <th>Department</th>
            <th>Head</th>
            <th class="text-end">Projects</th>
          </tr>
        </thead>
        <tbody id="departmentTableBody">
          <tr><td colspan="3" class="text-muted">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
