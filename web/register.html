<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up / Register — Mini-Project Portfolio Monitoring Portal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card" style="max-width: 32rem;">
      <h1>Sign up / Register</h1>
      <p class="sub">Create an account to access your department or mentor dashboard</p>

      <div class="alert alert--error" id="error-box" role="alert" hidden>
        <span id="error-text"></span>
      </div>

      <div class="alert alert--success" id="success-box" role="alert" hidden>
        <span id="success-text"></span>
      </div>

      <form id="register-form" novalidate>
        <div class="field">
          <label for="reg-name">Full name</label>
          <input id="reg-name" name="name" type="text" placeholder="e.g. Dr. Narayan D G" required />
        </div>

        <div class="field">
          <label for="reg-email">Email address</label>
          <input id="reg-email" name="email" type="email" autocomplete="username" placeholder="e.g. narayan.dg@kletech.example" required />
        </div>

        <div class="field">
          <label for="reg-role">Role</label>
          <select id="reg-role" name="role" required>
            <option value="Department Head">Department Head (HOD)</option>
            <option value="Faculty Mentor">Faculty Mentor</option>
          </select>
        </div>

        <div class="field" id="dept-field">
          <label for="reg-dept">Assigned Department</label>
          <select id="reg-dept" name="did" required>
            <!-- Populated dynamically -->
          </select>
          <p class="hint" style="margin-top: 0.25rem; font-size: 0.8rem; color: var(--ink-soft, #666);">
            Select the department you head or teach in.
          </p>
        </div>

        <div class="field">
          <label for="reg-password">Password</label>
          <input id="reg-password" name="password" type="password" autocomplete="new-password" required />
        </div>

        <div class="field">
          <label for="reg-confirm">Confirm Password</label>
          <input id="reg-confirm" name="confirm" type="password" autocomplete="new-password" required />
        </div>

        <button type="submit" class="btn--primary" id="submit-btn" style="margin-top: 1rem;">
          Register &amp; Open Dashboard
        </button>
      </form>

      <div class="auth-foot" style="margin-top: 1.5rem; text-align: center;">
        <a href="index.html">Already registered? Sign in here</a>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    const deptSelect = document.getElementById('reg-dept');
    const form = document.getElementById('register-form');
    const errorBox = document.getElementById('error-box');
    const errorText = document.getElementById('error-text');
    const successBox = document.getElementById('success-box');
    const successText = document.getElementById('success-text');
    const submitBtn = document.getElementById('submit-btn');

    // Populate departments dropdown from DATA.depts
    DATA.depts.forEach((d) => {
      const opt = document.createElement('option');
      opt.value = d.did;
      opt.textContent = `${d.name} (${d.code || 'Dept'})`;
      // Default select CSE-AI (did 6) if present for convenience
      if (d.did === 6) {
        opt.selected = true;
      }
      deptSelect.appendChild(opt);
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      errorBox.hidden = true;
      successBox.hidden = true;

      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const role = document.getElementById('reg-role').value;
      const did = Number(deptSelect.value);
      const password = document.getElementById('reg-password').value;
      const confirm = document.getElementById('reg-confirm').value;

      if (!name) {
        errorText.textContent = 'Please enter your full name.';
        errorBox.hidden = false;
        return;
      }
      if (!email || !email.includes('@')) {
        errorText.textContent = 'Please enter a valid email address.';
        errorBox.hidden = false;
        return;
      }
      if (!password || password.length < 4) {
        errorText.textContent = 'Password must be at least 4 characters.';
        errorBox.hidden = false;
        return;
      }
      if (password !== confirm) {
        errorText.textContent = 'Passwords do not match.';
        errorBox.hidden = false;
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Registering…';

      // Define scope based on role
      let scope;
      if (role === 'Department Head') {
        scope = { level: 'dept', did: did };
      } else {
        // Faculty Mentor
        const matchingFaculty = DATA.faculty.find((f) => f.name.toLowerCase() === name.toLowerCase()) || DATA.faculty.find((f) => f.did === did);
        scope = { level: 'faculty', fid: matchingFaculty ? matchingFaculty.fid : 1 };
      }

      // Save user in custom roles storage
      const user = registerUser({ role, email, password, scope, name });

      // Automatically set active session
      sessionStorage.setItem('apnileap_session', JSON.stringify({
        role: user.role,
        email: user.email,
        scope: user.scope,
        name: user.name,
      }));

      successText.textContent = 'Registration successful! Redirecting to your dashboard…';
      successBox.hidden = false;

      setTimeout(() => {
        window.location.href = homeUrlFor(scope);
      }, 750);
    });
  </script>
</body>
</html>
